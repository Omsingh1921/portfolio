    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
